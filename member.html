  <style>
    :root {
      --bg: #111111;
      --gold: #d9a441;
      --gold-soft: #f3d28a;
      --text: #f8f5ee;
      --sub: #c9c4b7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background:
        radial-gradient(circle at 50% 20%, rgba(217, 164, 65, 0.16), transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Apple SD Gothic Neo", system-ui, sans-serif;
    }
    .card {
      width: min(520px, 100%);
      display: grid;
      gap: 1rem;
      padding: 1.6rem 1.4rem;
      border-radius: 1.2rem;
      border: 1px solid rgba(217, 164, 65, 0.28);
      background: rgba(255, 255, 255, 0.03);
    }
    .eyebrow {
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      color: rgba(243, 210, 138, 0.8);
    }
    h1 {
      font-size: clamp(1.5rem, 4vw, 2rem);
      color: var(--gold-soft);
      letter-spacing: 0.04em;
    }
    p {
      color: var(--sub);
      line-height: 1.65;
      font-size: 0.95rem;
    }
    .badge {
      display: inline-flex;
      width: fit-content;
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
      border: 1px solid rgba(217, 164, 65, 0.4);
      color: var(--gold-soft);
      font-size: 0.75rem;
      font-weight: 700;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      margin-top: 0.4rem;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.65rem 1.15rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .primary {
      background: linear-gradient(135deg, var(--gold), var(--gold-soft));
      color: #111;
    }
    .ghost {
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: var(--text);
    }
  </style>
  <link rel="stylesheet" href="assets/css/dist/site-typography.min.css?v=20260717af" />

<body>
  <main class="card">

    <p>
      연락처와 배달지 주소를 저장하는 회원 등록은 Phase 2에서 연결됩니다.
      지금은 주문 화면에서 배달 정보를 입력해 주문할 수 있습니다.
    </p>
    <div class="actions">
      <a class="primary" href="order.html">주문에서 배달정보 입력</a>
      <a class="ghost" href="index.html">홈으로</a>
      <a class="ghost" href="ai-order.html">AI 음성 주문</a>

    <div class="detail-character__col">
      <div class="detail-character__stage"></div>
